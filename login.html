<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Readora Library - Login</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Navigation Header with Integrated Role Switcher -->
  <header>
    <div class="container">
      <nav class="navbar">
        <a href="index.html" class="logo">
          <span class="logo-icon">&#128218;</span>
          <div class="logo-text">
            <span class="logo-title">Online Library</span>
            <span class="logo-subtitle">Academic Portal</span>
          </div>
        </a>

        <div class="nav-actions">
          <div class="nav-role-switcher">
            <span class="role-label">Role:</span>
            <a href="index.html" class="role-btn active">Guest</a>
            <a href="login.html" class="role-btn">User</a>
            <a href="login.html" class="role-btn">Admin</a>
          </div>

          <ul class="nav-menu">
            <li><a href="catalogue.html">Catalogue</a></li>
            <li><a href="signup.html" class="book-btn book-btn-small book-btn-secondary">Sign Up</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </header>

  <!-- Page Content -->
  <main class="main-content">
    <div class="container">
      
      <div class="form-card">
        <h2 class="form-title">Sign In to Your Account</h2>

        <form action="catalogue-user.html">
          
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
            <input type="email" id="login-email" class="input-field" placeholder="student@university.edu" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password <span class="required">*</span></label>
            <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="login-role">Select Role</label>
            <select id="login-role" class="input-field">
              <option value="user">Regular Member </option>
              <option value="admin">Library Administrator</option>
            </select>
          </div>

          <button type="submit" class="book-btn book-btn-block">Sign In</button>

          <p class="form-footer-text">
            Don't have an account? <a href="signup.html" class="form-link">Create Account</a>
          </p>

        </form>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Online Library System - IS231 Web Technology.</p>
    </div>
  </footer>

</body>
</html>
